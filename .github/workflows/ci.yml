name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - run: python3 Main.py
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake build
      - name: No sorry / admit / custom axioms
        run: |
          ! grep -nE '\bsorry\b|\badmit\b|^axiom ' *.lean
          lake env lean CheckAxioms.lean | tee axioms.txt
          if grep 'depends on axioms:' axioms.txt | grep -vE "depends on axioms: \[(propext|Quot.sound)(, (propext|Quot.sound))*\]$"; then exit 1; fi
